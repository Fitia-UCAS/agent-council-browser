<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-LLM Debate</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="title-group">
                <div class="title">Multi-LLM Debate</div>
                <div class="subtitle">Side panel session runner</div>
            </div>
            <div class="status-chips">
                <span class="chip" id="status-chatgpt">ChatGPT: checking</span>
                <span class="chip" id="status-gemini">Gemini: checking</span>
            </div>
        </header>

        <details class="settings" id="settings" open>
            <summary class="settings-summary">
                <span>Session settings</span>
                <span class="material-symbols-rounded">tune</span>
            </summary>
            <div class="settings-body">
                <div class="settings-grid">
                    <label class="field">
                        <span class="field-label">First LLM</span>
                        <select id="first-llm">
                            <option value="chatgpt">ChatGPT</option>
                            <option value="gemini">Gemini</option>
                        </select>
                    </label>
                    <label class="field">
                        <span class="field-label">Iterations</span>
                        <input id="iterations" type="number" min="1" max="12" value="3">
                    </label>
                    <label class="field">
                        <span class="field-label">ChatGPT tab</span>
                        <select id="chatgpt-tab"></select>
                    </label>
                    <label class="field">
                        <span class="field-label">Gemini tab</span>
                        <select id="gemini-tab"></select>
                    </label>
                </div>
                <div class="settings-actions">
                    <button class="ghost-button" id="refresh-tabs" type="button">Refresh tabs</button>
                    <label class="inline-toggle">
                        <input type="checkbox" id="auto-scroll" checked>
                        <span>Auto-scroll transcript</span>
                    </label>
                </div>
                <div class="session-status" id="session-status">Idle</div>
            </div>
        </details>

        <main class="timeline" id="timeline">
            <div class="empty-state" id="empty-state">
                <div class="empty-title">No session yet</div>
                <div class="empty-subtitle">Send a prompt to start the debate.</div>
            </div>
        </main>

        <footer class="composer">
            <label class="composer-label" for="prompt-input">Prompt</label>
            <textarea id="prompt-input" rows="3" maxlength="8000" placeholder="Ask a question for ChatGPT and Gemini..."></textarea>
            <div class="composer-actions">
                <div class="composer-meta">
                    <span id="char-count">0</span>/8000
                </div>
                <div class="composer-buttons">
                    <button class="secondary-button" id="stop-button" type="button" disabled>Stop</button>
                    <button class="primary-button" id="send-button" type="button" disabled>Start debate</button>
                </div>
            </div>
        </footer>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
