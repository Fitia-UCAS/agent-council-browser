name: PR Hygiene

on:
    pull_request:
        types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
    contents: read
    pull-requests: write

jobs:
    hygiene:
        runs-on: ubuntu-latest
        steps:
            - name: Validate PR title
              uses: actions/github-script@v7
              with:
                  script: |
                      const title = context.payload.pull_request?.title || '';
                      const convention = /^(feat|fix|docs|refactor|test|chore|ci|perf)(\([^)]+\))?:\s.+/;
                      if (!convention.test(title)) {
                        core.setFailed(
                          `PR title must match Conventional Commits style. Example: "fix(route-builder): handle missing default profile". Current title: "${title}"`
                        );
                      }

            - name: Post changed-files summary
              uses: actions/github-script@v7
              with:
                  script: |
                      const marker = '<!-- pr-hygiene-summary -->';
                      const pr = context.payload.pull_request;
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                        owner,
                        repo,
                        pull_number: pr.number,
                        per_page: 100,
                      });

                      const additions = files.reduce((sum, f) => sum + (f.additions || 0), 0);
                      const deletions = files.reduce((sum, f) => sum + (f.deletions || 0), 0);
                      const changed = files.length;
                      const sample = files.slice(0, 20).map((f) => `- \`${f.filename}\``).join('\n');

                      const body = [
                        marker,
                        '### PR Hygiene Summary',
                        `- Changed files: **${changed}**`,
                        `- Additions: **${additions}**`,
                        `- Deletions: **${deletions}**`,
                        '',
                        changed > 0 ? '#### Files (first 20)' : 'No changed files detected.',
                        sample,
                      ].filter(Boolean).join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner,
                        repo,
                        issue_number: pr.number,
                        per_page: 100,
                      });

                      const existing = comments.find((comment) =>
                        comment.user?.type === 'Bot' &&
                        typeof comment.body === 'string' &&
                        comment.body.includes(marker)
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner,
                          repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number: pr.number,
                          body,
                        });
                      }
