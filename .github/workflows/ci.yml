name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: |
          node --check background.js
          node --check src/background/session-helpers.js
          node --check src/background/profile-service.js
          node --check src/background/prompt-service.js
          node --check src/background/transport-service.js
          node --check src/background/history-chat-service.js
          node --check src/background/session-registry.js
          node --check sidepanel.js
          node --check contentScript.js
          node --check historyStore.js

      - name: Run tests
        run: npm test

      - name: Build variant package
        run: npm run build:variant
