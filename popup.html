<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-LLM Coder</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            width: 400px;
            height: 600px;
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family-sans);
            overflow: hidden;
        }
        .popup-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .popup-header {
            background: var(--bg-secondary);
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-primary);
        }
        .popup-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-primary);
            margin: 0;
        }
        .popup-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 4px 0 0 0;
        }
        .popup-content {
            flex: 1;
            padding: var(--spacing-md);
            overflow-y: auto;
        }
        .input-group {
            margin-bottom: var(--spacing-md);
        }
        .popup-textarea {
            width: 100%;
            min-height: 80px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 6px;
            padding: var(--spacing-sm);
            color: var(--text-primary);
            font-family: var(--font-family-mono);
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }
        .popup-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .char-counter {
            text-align: right;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .llm-options {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        .llm-option {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.85rem;
        }
        .send-btn {
            width: 100%;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: var(--spacing-md);
        }
        .send-btn:hover:not(:disabled) {
            background: #45a049;
        }
        .send-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .status-section {
            background: var(--bg-secondary);
            padding: var(--spacing-sm);
            border-radius: 6px;
            margin-bottom: var(--spacing-md);
        }
        .status-title {
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: var(--spacing-xs);
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 4px;
        }
        .status-ready { color: var(--accent-primary); }
        .status-error { color: var(--accent-error); }
        .status-processing { color: var(--accent-warning); }
        .response-section {
            background: var(--bg-secondary);
            border-radius: 6px;
            padding: var(--spacing-sm);
            max-height: 200px;
            overflow-y: auto;
        }
        .response-title {
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: var(--spacing-xs);
        }
        .response-content {
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .empty-response {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="popup-header">
            <h1 class="popup-title">Multi-LLM Coder</h1>
            <p class="popup-subtitle">Send prompts to multiple AI models</p>
        </div>
        
        <div class="popup-content">
            <div class="input-group">
                <textarea 
                    id="prompt-input" 
                    class="popup-textarea" 
                    placeholder="Enter your prompt here..."
                    maxlength="4000"
                ></textarea>
                <div class="char-counter">
                    <span id="char-count">0</span>/4000
                </div>
            </div>
            
            <div class="llm-options">
                <label class="llm-option">
                    <input type="checkbox" id="use-gemini" checked>
                    <span>Gemini</span>
                </label>
                <label class="llm-option">
                    <input type="checkbox" id="use-chatgpt" checked>
                    <span>ChatGPT</span>
                </label>
            </div>
            
            <button id="send-button" class="send-btn" disabled>
                Send Prompt
            </button>
            
            <div class="status-section">
                <div class="status-title">Connection Status</div>
                <div class="status-item">
                    <span>Gemini:</span>
                    <span id="gemini-status" class="status-error">Checking...</span>
                </div>
                <div class="status-item">
                    <span>ChatGPT:</span>
                    <span id="chatgpt-status" class="status-error">Checking...</span>
                </div>
            </div>
            
            <div class="response-section">
                <div class="response-title">Last Response</div>
                <div id="response-content" class="response-content empty-response">
                    No responses yet. Send a prompt to get started!
                </div>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
